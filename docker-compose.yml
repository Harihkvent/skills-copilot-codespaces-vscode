version: '3.8'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: astra-postgres
    environment:
      POSTGRES_USER: astra
      POSTGRES_PASSWORD: astra_password
      POSTGRES_DB: astra_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astra"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: astra-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama service - OPTIONAL (only needed if LLM_PROVIDER=local)
  # Uncomment this service if you want to use local Ollama instead of Krutrim
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: astra-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:11434/"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 40s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: astra-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./logs:/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Remove ollama dependency - using Krutrim cloud API instead
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data:
  # ollama_data:  # Uncomment if using local Ollama
