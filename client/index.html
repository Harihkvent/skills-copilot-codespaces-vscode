<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astra - Voice Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        
        .auth-section {
            margin-bottom: 30px;
        }
        
        .auth-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .user-info {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .command-input {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        input[type="text"], input[type="password"], input[type="email"] {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            padding: 15px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .response-area {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        
        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
        }
        
        .message.user {
            background: #e3f2fd;
            text-align: right;
        }
        
        .message.assistant {
            background: #f3e5f5;
        }
        
        .message.error {
            background: #ffebee;
            color: #c62828;
        }
        
        .message strong {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9em;
            opacity: 0.7;
        }
        
        .hidden {
            display: none;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            width: 90%;
        }
        
        .modal-content h2 {
            margin-bottom: 20px;
            color: #667eea;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }
        
        .form-group input {
            width: 100%;
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .modal-buttons button {
            flex: 1;
        }
        
        .btn-secondary {
            background: #999;
        }
        
        .btn-secondary:hover {
            background: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Astra</h1>
        <p class="subtitle">Voice-First Agentic Assistant</p>
        
        <div class="auth-section" id="authSection">
            <div class="auth-buttons">
                <button onclick="showLoginModal()">Login</button>
                <button onclick="showRegisterModal()">Register</button>
            </div>
        </div>
        
        <div class="user-info hidden" id="userInfo">
            <strong>Logged in as: <span id="username"></span></strong>
            <button onclick="logout()" style="margin-left: 10px;">Logout</button>
        </div>
        
        <div class="command-input">
            <input type="text" id="commandInput" placeholder="Ask Astra anything..." disabled>
            <button id="sendButton" onclick="sendCommand()" disabled>Send</button>
        </div>
        
        <div class="response-area" id="responseArea">
            <p style="color: #999; text-align: center;">Please login to start chatting with Astra</p>
        </div>
    </div>
    
    <!-- Login Modal -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <h2>Login</h2>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="loginUsername">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword">
            </div>
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="closeModals()">Cancel</button>
                <button onclick="login()">Login</button>
            </div>
        </div>
    </div>
    
    <!-- Register Modal -->
    <div class="modal" id="registerModal">
        <div class="modal-content">
            <h2>Register</h2>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="registerUsername">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="registerEmail">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="registerPassword">
            </div>
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="closeModals()">Cancel</button>
                <button onclick="register()">Register</button>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:8000';
        let authToken = localStorage.getItem('authToken');
        let currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
        
        // Initialize
        if (authToken && currentUser) {
            showLoggedInState();
        }
        
        function showLoginModal() {
            document.getElementById('loginModal').classList.add('show');
        }
        
        function showRegisterModal() {
            document.getElementById('registerModal').classList.add('show');
        }
        
        function closeModals() {
            document.getElementById('loginModal').classList.remove('show');
            document.getElementById('registerModal').classList.remove('show');
        }
        
        async function login() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            
            if (!username || !password) {
                addMessage('error', 'Please fill in all fields');
                return;
            }
            
            try {
                const formData = new URLSearchParams();
                formData.append('username', username);
                formData.append('password', password);
                
                const response = await fetch(`${API_BASE}/api/v1/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: formData
                });
                
                if (response.ok) {
                    const data = await response.json();
                    authToken = data.access_token;
                    currentUser = data.user;
                    localStorage.setItem('authToken', authToken);
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    showLoggedInState();
                    closeModals();
                    addMessage('assistant', 'Welcome back! How can I help you today?');
                } else {
                    const error = await response.json();
                    addMessage('error', error.detail || 'Login failed');
                }
            } catch (error) {
                addMessage('error', 'Connection error. Make sure the API is running.');
            }
        }
        
        async function register() {
            const username = document.getElementById('registerUsername').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            
            if (!username || !email || !password) {
                addMessage('error', 'Please fill in all fields');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/v1/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, email, password })
                });
                
                if (response.ok) {
                    addMessage('assistant', 'Registration successful! Please login.');
                    closeModals();
                    showLoginModal();
                } else {
                    const error = await response.json();
                    addMessage('error', error.detail || 'Registration failed');
                }
            } catch (error) {
                addMessage('error', 'Connection error. Make sure the API is running.');
            }
        }
        
        function logout() {
            authToken = null;
            currentUser = null;
            localStorage.removeItem('authToken');
            localStorage.removeItem('currentUser');
            showLoggedOutState();
            document.getElementById('responseArea').innerHTML = '<p style="color: #999; text-align: center;">Please login to start chatting with Astra</p>';
        }
        
        function showLoggedInState() {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('userInfo').classList.remove('hidden');
            document.getElementById('username').textContent = currentUser.username;
            document.getElementById('commandInput').disabled = false;
            document.getElementById('sendButton').disabled = false;
        }
        
        function showLoggedOutState() {
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('userInfo').classList.add('hidden');
            document.getElementById('commandInput').disabled = true;
            document.getElementById('sendButton').disabled = true;
        }
        
        async function sendCommand() {
            const input = document.getElementById('commandInput');
            const command = input.value.trim();
            
            if (!command) return;
            
            addMessage('user', command);
            input.value = '';
            
            try {
                const response = await fetch(`${API_BASE}/api/v1/command`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({
                        user_id: currentUser.id,
                        command: command
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const message = data.message || JSON.stringify(data.result, null, 2);
                    addMessage('assistant', message);
                } else {
                    const error = await response.json();
                    addMessage('error', error.detail || 'Command failed');
                }
            } catch (error) {
                addMessage('error', 'Connection error. Make sure the API is running.');
            }
        }
        
        function addMessage(type, text) {
            const responseArea = document.getElementById('responseArea');
            
            // Clear welcome message if it exists
            if (responseArea.children.length === 1 && responseArea.textContent.includes('Please login')) {
                responseArea.innerHTML = '';
            }
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const label = type === 'user' ? 'You' : type === 'error' ? 'Error' : 'Astra';
            messageDiv.innerHTML = `<strong>${label}</strong><div>${text}</div>`;
            
            responseArea.appendChild(messageDiv);
            responseArea.scrollTop = responseArea.scrollHeight;
        }
        
        // Allow Enter key to send command
        document.getElementById('commandInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendCommand();
            }
        });
    </script>
</body>
</html>
